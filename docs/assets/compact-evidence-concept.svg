<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Compact evidence proof of concept</title>
<desc>Two pipelines use the same Nomic retrieval and Gemma model. The proposed pipeline selects smaller original source passages, with conservative fallbacks. Performance has not been measured.</desc>
<rect width="1920" height="1080" fill="#F7F8FA"/>
<text x="80" y="58" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#182D3C" dominant-baseline="text-before-edge">Smaller evidence, same model</text>
<text x="82" y="137" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#536777" dominant-baseline="text-before-edge">A focused TokenSmith experiment: change the input, then measure the effect.</text>
